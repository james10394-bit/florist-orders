<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>隅花相識｜訂單日曆</title><link rel="stylesheet" href="style.css"></head><body><header><h1><!-- brand -->隅花相識｜訂單日曆 <small>v1.0.0</small></h1><p>接單、製作、配送與收款，一頁掌握</p></header><main><section class="toolbar"><button id="new">＋ 新增訂單</button><button id="export">匯出備份 JSON</button><label class="button">匯入備份<input id="import" type="file" accept="application/json,.json" hidden></label><button id="ics">下載日曆 .ics</button><span id="notice" role="status"></span></section><section class="summary" id="summary"></section><section class="filters"><input id="search" placeholder="搜尋訂單、客戶、收件人、電話、品項"><select id="statusFilter"><option value="">所有狀態</option><option>待確認</option><option>待製作</option><option>製作中</option><option>待配送</option><option>已完成</option><option>已取消</option></select><select id="dateFilter"><option value="">所有日期</option><option value="today">今天</option><option value="week">未來七天</option></select></section><section class="layout"><div class="panel"><div class="calendar-head"><button id="prev" aria-label="上個月">‹</button><h2 id="month"></h2><button id="next" aria-label="下個月">›</button></div><div id="calendar" class="calendar"></div></div><div class="panel"><h2>訂單列表 <span id="count"></span></h2><div id="orders"></div></div></section></main><dialog id="editor"><form id="form"><h2 id="formTitle">新增訂單</h2><div class="fields"><label>訂購人姓名 *<input name="customer" required maxlength="80"></label><label>訂購人電話 *<input name="customerPhone" required maxlength="40" inputmode="tel"></label><label>接單來源<select name="source"><option>LINE</option><option>電話</option><option>門市</option><option>Instagram</option><option>Facebook</option><option>官網</option><option>其他</option></select></label><label>品項 *<select name="product" required><option>花束</option><option>花盒</option><option>盆花</option><option>盆栽</option><option>開幕花籃</option><option>告別式花禮</option><option>婚禮／活動花藝</option><option>散花</option><option>客製其他</option></select></label><label>數量 *<input name="quantity" type="number" min="1" max="9999" value="1" required></label><label>單價（NT$） *<input name="unitPrice" type="number" min="0" max="99999999" value="0" required></label><label>配送費（NT$）<input name="deliveryFee" type="number" min="0" max="99999999" value="0"></label><label>折扣（NT$）<input name="discount" type="number" min="0" max="99999999" value="0"></label><label>製作日期<input name="productionDate" type="date"></label><label>取貨／配送日期 *<input name="deliveryDate" type="date" required></label><label>時段 *<select name="slot"><option>上午 09:00–12:00</option><option>下午 12:00–17:00</option><option>晚上 17:00–21:00</option><option>指定時間（見備註）</option></select></label><label>交付方式<select name="method" id="method"><option>店取</option><option>配送</option></select></label><label>收件人姓名<input name="recipient" maxlength="80"></label><label>收件人電話<input name="recipientPhone" maxlength="40" inputmode="tel"></label><label class="wide">配送地址<input name="address" maxlength="300"></label><label>訂單狀態<select name="status"><option>待確認</option><option>待製作</option><option>製作中</option><option>待配送</option><option>已完成</option><option>已取消</option></select></label><label>付款狀態<select name="payment"><option>未付款</option><option>部分付款</option><option>已付款</option><option>已退款</option></select></label><label>付款方式<select name="paymentMethod"><option>現金</option><option>轉帳</option><option>信用卡</option><option>LINE Pay</option><option>其他</option></select></label><label>已收金額（NT$）<input name="paid" type="number" min="0" max="99999999" value="0"></label><label class="wide">色系／花材／客製需求<textarea name="design" maxlength="1000"></textarea></label><label class="wide">卡片文字<textarea name="card" maxlength="1000"></textarea></label><label class="wide">備註（門牌、指定時間、禁忌花材等）<textarea name="notes" maxlength="1000"></textarea></label></div><p id="totalPreview"></p><footer><button type="button" id="cancel">取消</button><button type="submit">儲存訂單</button></footer></form></dialog><script src="app.js"></script></body></html>
